[project]
name = "n3"
version = "0.1.0"
description = "N3 Data Platform — Control Plane и Execution Controller"
authors = [
    { name = "trudogolik45", email = "210735425+trudogolik45@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.118",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "kubernetes-asyncio>=36.1.0",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.118",
    "import-linter>=2.15",
    "pyarrow>=26.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "testcontainers[minio,postgres]>=4.15.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
n3-contracts-schema = "n3.shared.schemas:print_json_schema"
n3-register-block = "n3.cli.register_block:main"
n3-execution-controller = "n3.execution.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"
# Блоки исполняются в образе Spark с его Python 3.10.
per-file-target-version = { "blocks/**" = "py310", "tests/blocks/**" = "py310" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Тексты на русском: кириллица не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pyright]
include = ["src", "tests", "alembic"]
# pyspark есть только в образе Spark: блоки и их тесты pyright не видит.
exclude = ["tests/blocks"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: требует Docker (PostgreSQL, MinIO и Kafka через testcontainers)"]

[tool.importlinter]
root_package = "n3"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Внутренности identity видны только identity"
type = "protected"
protected_modules = ["n3.identity.*"]
allowed_importers = ["n3.identity"]

[[tool.importlinter.contracts]]
name = "Внутренности catalog видны только catalog"
type = "protected"
protected_modules = ["n3.catalog.*"]
allowed_importers = ["n3.catalog"]

[[tool.importlinter.contracts]]
name = "Внутренности blocks видны только blocks"
type = "protected"
protected_modules = ["n3.blocks.*"]
allowed_importers = ["n3.blocks"]

[[tool.importlinter.contracts]]
name = "Внутренности pipelines видны только pipelines"
type = "protected"
protected_modules = ["n3.pipelines.*"]
allowed_importers = ["n3.pipelines"]

[[tool.importlinter.contracts]]
name = "Внутренности runs видны только runs"
type = "protected"
protected_modules = ["n3.runs.*"]
allowed_importers = ["n3.runs"]

[[tool.importlinter.contracts]]
name = "shared не зависит от доменных модулей"
type = "forbidden"
source_modules = ["n3.shared"]
forbidden_modules = [
    "n3.identity",
    "n3.catalog",
    "n3.blocks",
    "n3.pipelines",
    "n3.runs",
    "n3.api",
    "n3.execution",
]

[[tool.importlinter.contracts]]
name = "Код продукта не импортирует тесты и Fake Execution Controller"
type = "forbidden"
source_modules = ["n3"]
forbidden_modules = ["tests", "pyarrow"]

[[tool.importlinter.contracts]]
name = "CLI — тонкий HTTP-клиент: без слоя БД и доменных модулей"
type = "forbidden"
source_modules = ["n3.cli"]
forbidden_modules = [
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "n3.identity",
    "n3.catalog",
    "n3.blocks",
    "n3.pipelines",
    "n3.runs",
    "n3.api",
]

[[tool.importlinter.contracts]]
name = "Execution Controller — Execution Plane: из n3 только n3.shared, без PostgreSQL (ADR-0001)"
type = "forbidden"
source_modules = ["n3.execution"]
# Любой пакет n3, кроме самого n3.execution и разрешённого ниже n3.shared:
# новый модуль Control Plane попадает под запрет без правки контракта.
forbidden_modules = ["n3.*", "sqlalchemy", "asyncpg", "alembic", "fastapi"]
ignore_imports = ["n3.execution.** -> n3.shared.**"]
