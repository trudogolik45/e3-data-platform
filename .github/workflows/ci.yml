name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run lint-imports
      - name: Typecheck
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest tests/unit
      - name: Integration tests
        run: uv run pytest tests/integration
