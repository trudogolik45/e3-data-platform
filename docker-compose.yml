services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: e3
      POSTGRES_PASSWORD: e3
      POSTGRES_DB: e3
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e3"]
      interval: 2s
      retries: 30

  kafka:
    # Официальный образ, KRaft без ZooKeeper. Хост ходит на :9092, контейнеры — на kafka:19092.
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 3s
      retries: 30

  minio:
    # Официальный minio/minio больше не публикуется на Docker Hub.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: amazon/aws-cli:latest
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >
        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket e3-lake 2>/dev/null
        || aws --endpoint-url http://minio:9000 s3api create-bucket --bucket e3-lake

  oidc:
    # Только для локальной разработки и e2e: выдаёт JWT любому client_id без пароля.
    # Токен: POST http://localhost:8080/e3/token, grant_type=client_credentials, client_id=<логин>.
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    environment:
      JSON_CONFIG: >
        {"tokenCallbacks": [{"issuerId": "e3", "tokenExpiry": 3600, "requestMappings": [
          {"requestParam": "client_id", "match": "*", "claims": {
            "sub": "$${clientId}", "aud": ["e3-api"],
            "email": "$${clientId}@e3.local", "email_verified": true}}]}]}
    ports: ["8080:8080"]

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      oidc: { condition: service_started }
    environment:
      E3_ENVIRONMENT: dev
      E3_AUTH_MODE: oidc
      # `iss` — адрес, по которому токен берут с хоста; ключи API читает изнутри сети compose.
      E3_OIDC_ISSUER: http://localhost:8080/e3
      E3_OIDC_AUDIENCE: e3-api
      E3_OIDC_JWKS_URL: http://oidc:8080/e3/jwks
      E3_DATABASE_URL: postgresql+asyncpg://e3:e3@postgres:5432/e3
      E3_S3_ENDPOINT_URL: http://minio:9000
      E3_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      E3_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # E2E укорачивает таймаут reconciliation, чтобы потерянная попытка нашлась за время теста.
      E3_RECONCILE_AFTER_SECONDS: ${E3_RECONCILE_AFTER_SECONDS:-600}
      # Размер pod'а попытки задаёт Control Plane; E2E на тесном стенде просит долю ядра.
      E3_SPARK_CORE_REQUEST: ${E3_SPARK_CORE_REQUEST:-1}
      # Только для локальной разработки: токен admin API регистрации блоков.
      E3_PLATFORM_TOKEN: dev-platform-token
    ports: ["8000:8000"]
