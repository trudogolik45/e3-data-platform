services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: e3
      POSTGRES_PASSWORD: e3
      POSTGRES_DB: e3
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e3"]
      interval: 2s
      retries: 30

  minio:
    # Официальный minio/minio больше не публикуется на Docker Hub.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: amazon/aws-cli:latest
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >
        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket e3-lake 2>/dev/null
        || aws --endpoint-url http://minio:9000 s3api create-bucket --bucket e3-lake

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      E3_ENVIRONMENT: dev
      E3_DATABASE_URL: postgresql+asyncpg://e3:e3@postgres:5432/e3
      E3_S3_ENDPOINT_URL: http://minio:9000
      E3_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    ports: ["8000:8000"]
