# BlockSpec блока `Filter` для `e3-register-block`.
# `executable_ref` подставляет сборка: digest образа из registry (см. scripts/e2e.sh).
name: filter
version: "1.0.0"
runtime: spark
inputs:
  - { name: source, data_type: dataset }
outputs:
  - { name: result, data_type: dataset }
parameters_schema:
  type: object
  required: [conditions]
  additionalProperties: false
  properties:
    # Все условия через AND.
    conditions:
      type: array
      minItems: 1
      items:
        type: object
        required: [column, op, value]
        additionalProperties: false
        properties:
          column: { type: string, minLength: 1 }
          op: { enum: [eq, ne, gt, gte, lt, lte] }
          value: { type: [string, number] }
executable_ref: "@EXECUTABLE_REF@"
